name: "Skenario 2 - Level 3 - Deploy Flask multi-branch (self-hosted VM-B)"

on:
  push:
    branches: [ main, staging ]
    paths:
      - 'skenario2-self-hosted-runner/level3-python-flask-multibranch/app/**'

  schedule:
    - cron: '0 3 * * 1'

  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch yang mau dideploy'
        required: true
        type: choice
        options:
          - main
          - staging
        default: main

jobs:
  deploy:
    name: Deploy Flask app langsung di VM-B
    runs-on: [self-hosted, vm-b]

    steps:

      - name: Checkout kode
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.branch || github.ref }}

      - name: Tentukan target folder
        id: target
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            BRANCH="${{ inputs.branch }}"
          elif [[ "${GITHUB_REF_NAME}" == "staging" ]]; then
            BRANCH="staging"
          else
            BRANCH="main"
          fi

          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"

          if [[ "${BRANCH}" == "staging" ]]; then
            echo "dir=/opt/level3-flask-vmb/staging" >> "$GITHUB_OUTPUT"
          else
            echo "dir=/opt/level3-flask-vmb/main" >> "$GITHUB_OUTPUT"
          fi

      - name: Salin kode Flask
        run: |
          mkdir -p "${{ steps.target.outputs.dir }}"

          cp \
            skenario2-self-hosted-runner/level3-python-flask-multibranch/app/app.py \
            "${{ steps.target.outputs.dir }}/"

          cp \
            skenario2-self-hosted-runner/level3-python-flask-multibranch/app/requirements.txt \
            "${{ steps.target.outputs.dir }}/"

      - name: Install dependency
        run: |
          /opt/level3-flask-vmb/venv/bin/pip install \
            -r "${{ steps.target.outputs.dir }}/requirements.txt"

      - name: Update WorkingDirectory & restart
        run: |
          sudo sed -i \
            "s#^WorkingDirectory=.*#WorkingDirectory=${{ steps.target.outputs.dir }}#" \
            /etc/systemd/system/level3-flask-vmb.service

          sudo systemctl daemon-reload
          sudo systemctl restart level3-flask-vmb

      - name: Cek status service
        run: |
          sudo systemctl status level3-flask-vmb --no-pager

      - name: Test Flask
        run: |
          curl -f http://localhost:5100
